<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="走行メモ">
  <meta name="theme-color" content="#111827">
  <title>走行評価メモ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <header class="topbar">
    <div class="title">走行評価メモ</div>
    <div class="meta"><span id="metaInfo"></span><button id="asrStatus" class="asr-pill" hidden></button></div>
  </header>

  <main>
    <!-- 記録 -->
    <section id="view-record" class="view active">
      <div class="cat-grid" id="catGrid"></div>
      <div class="recent" id="recent"></div>
      <div class="rec-row">
        <button id="recBtn" class="rec-btn" disabled>
          <span class="rec-dot"></span>
          <span id="recLabel">種類を選択してください</span>
          <span id="recTimer" class="rec-timer"></span>
        </button>
        <button id="langBtn" class="lang-btn" type="button">日本語</button>
      </div>
    </section>

    <!-- 一覧 -->
    <section id="view-list" class="view">
      <div class="list-actions">
        <button id="exportCsv" class="btn primary">CSV出力</button>
        <button id="exportZip" class="btn">CSV+音声ZIP</button>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table class="memo-table">
          <thead>
            <tr>
              <th>No</th><th>種類</th><th>開始 / 終了</th>
              <th class="col-text">テキスト</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="memoBody"></tbody>
        </table>
        <p class="empty" id="emptyMsg">記録はまだありません</p>
      </div>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view">
      <form id="settingsForm" class="settings">
        <h2>評価情報</h2>
        <label>車両ID<input type="text" name="vehicleId" autocomplete="off"></label>
        <label>評価者<input type="text" name="evaluator" autocomplete="off"></label>

        <h2>事象の種類（6個）</h2>
        <div id="catInputs"></div>
        <button type="button" id="resetCats" class="btn wide">種類を初期値に戻す</button>

        <h2>文字起こしモデル（端末内で処理）</h2>
        <div id="modelInputs"></div>
        <p class="hint">初回のみモデルをダウンロードします（Wi-Fi推奨）。以後は端末に保存され、通信なしで文字起こしできます。</p>
        <h2>モデルの配布元</h2>
        <div id="hostInputs"></div>
        <p class="hint">中国国内では huggingface.co に接続できないため hf-mirror.com を選んでください。一度ダウンロードしたモデルは配布元を変えても使えます（Whisper は配布元ごとに再ダウンロード）。</p>

        <button type="button" id="loadModel" class="btn wide">モデルをダウンロード／読込</button>
        <p class="hint model-status" id="modelStatus"></p>

        <h2>オプション</h2>
        <label class="check"><input type="checkbox" name="useGps"> 位置情報(GPS)を記録する</label>
        <label class="check"><input type="checkbox" name="keepAwake"> 画面を消灯させない</label>

        <button type="submit" class="btn primary wide">保存</button>
      </form>

      <div class="settings danger">
        <h2>データ管理</h2>
        <p class="hint" id="storageInfo"></p>
        <p class="hint persist" id="persistInfo"></p>
        <button id="clearAll" class="btn danger-btn wide">全記録を削除</button>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="record" class="active">記録</button>
    <button data-view="list">一覧</button>
    <button data-view="settings">設定</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="zip.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
